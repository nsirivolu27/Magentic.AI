<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a9a"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="18" fill="#0b0b0f"/>
  <text x="48" y="58" fill="#ededf2" font-size="26" font-weight="600">One workflow stage in Magentic</text>
  <text x="48" y="88" fill="#b0b0bf" font-size="16">AI drafts. People decide. Nothing advances on its own.</text>

  <!-- step 1 -->
  <g transform="translate(48 130)">
    <rect width="200" height="150" rx="14" fill="#121218" stroke="#2e2e3a"/>
    <circle cx="36" cy="38" r="16" fill="#1b1933" stroke="#3b3577"/>
    <text x="36" y="43" fill="#b3a7ff" font-size="14" text-anchor="middle" font-weight="700">1</text>
    <text x="20" y="86" fill="#ededf2" font-size="17" font-weight="600">Agent drafts</text>
    <text x="20" y="110" fill="#b0b0bf" font-size="13">Read only tools, call budget,</text>
    <text x="20" y="128" fill="#b0b0bf" font-size="13">timeout, required sources</text>
  </g>
  <line x1="256" y1="205" x2="282" y2="205" stroke="#8a8a9a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <g transform="translate(286 130)">
    <rect width="200" height="150" rx="14" fill="#121218" stroke="#2e2e3a"/>
    <circle cx="36" cy="38" r="16" fill="#1b1933" stroke="#3b3577"/>
    <text x="36" y="43" fill="#b3a7ff" font-size="14" text-anchor="middle" font-weight="700">2</text>
    <text x="20" y="86" fill="#ededf2" font-size="17" font-weight="600">Evidence attached</text>
    <text x="20" y="110" fill="#b0b0bf" font-size="13">Files read, tools called,</text>
    <text x="20" y="128" fill="#b0b0bf" font-size="13">checks passed or failed</text>
  </g>
  <line x1="494" y1="205" x2="520" y2="205" stroke="#8a8a9a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <g transform="translate(524 130)">
    <rect width="200" height="150" rx="14" fill="#121218" stroke="#2e2e3a"/>
    <circle cx="36" cy="38" r="16" fill="#1b1933" stroke="#3b3577"/>
    <text x="36" y="43" fill="#b3a7ff" font-size="14" text-anchor="middle" font-weight="700">3</text>
    <text x="20" y="86" fill="#ededf2" font-size="17" font-weight="600">Person reviews</text>
    <text x="20" y="110" fill="#b0b0bf" font-size="13">Draft beside the evidence,</text>
    <text x="20" y="128" fill="#b0b0bf" font-size="13">edits the handoff</text>
  </g>
  <line x1="732" y1="205" x2="758" y2="205" stroke="#8a8a9a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <g transform="translate(762 130)">
    <rect width="200" height="150" rx="14" fill="#121218" stroke="#2e2e3a"/>
    <circle cx="36" cy="38" r="16" fill="#1b1933" stroke="#3b3577"/>
    <text x="36" y="43" fill="#b3a7ff" font-size="14" text-anchor="middle" font-weight="700">4</text>
    <text x="20" y="86" fill="#ededf2" font-size="17" font-weight="600">Reviewer signs</text>
    <text x="20" y="110" fill="#b0b0bf" font-size="13">Never the author or owner,</text>
    <text x="20" y="128" fill="#b0b0bf" font-size="13">signs a content hash</text>
  </g>
  <line x1="970" y1="205" x2="996" y2="205" stroke="#8a8a9a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 5 -->
  <g transform="translate(1000 130)">
    <rect width="152" height="150" rx="14" fill="#10261b" stroke="#1f5a3d"/>
    <circle cx="36" cy="38" r="16" fill="#0b0b0f" stroke="#1f5a3d"/>
    <text x="36" y="44" fill="#6fd3a0" font-size="16" text-anchor="middle" font-weight="700">✓</text>
    <text x="20" y="86" fill="#ededf2" font-size="17" font-weight="600">Locked</text>
    <text x="20" y="110" fill="#b0b0bf" font-size="13">Stage advances,</text>
    <text x="20" y="128" fill="#b0b0bf" font-size="13">trail kept</text>
  </g>

  <!-- footer rule -->
  <rect x="48" y="312" width="1104" height="52" rx="10" fill="#2a230e" stroke="#6b5518"/>
  <text x="72" y="344" fill="#e9c46a" font-size="15" font-weight="600">If the output changes after signing, the signatures stop counting. The server enforces this, not the page.</text>
</svg>
