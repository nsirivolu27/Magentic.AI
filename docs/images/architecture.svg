<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a9a"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#0b0b0f"/>
  <text x="48" y="54" fill="#ededf2" font-size="24" font-weight="600">How it is built</text>
  <text x="48" y="82" fill="#b0b0bf" font-size="15">One Node process, one loopback port, files on disk. No database, no queue, no container.</text>

  <!-- browser -->
  <g transform="translate(48 120)">
    <rect width="300" height="230" rx="14" fill="#121218" stroke="#2e2e3a"/>
    <rect width="300" height="34" rx="14" fill="#1a1a23"/>
    <rect y="20" width="300" height="14" fill="#1a1a23"/>
    <circle cx="20" cy="17" r="5" fill="#8a8a9a"/><circle cx="38" cy="17" r="5" fill="#8a8a9a"/><circle cx="56" cy="17" r="5" fill="#8a8a9a"/>
    <text x="20" y="66" fill="#ededf2" font-size="17" font-weight="600">Browser window</text>
    <text x="20" y="90" fill="#b0b0bf" font-size="13">Pages are functions that return HTML.</text>
    <text x="20" y="108" fill="#b0b0bf" font-size="13">One React component: the work queue.</text>
    <g fill="#b3a7ff" font-size="13">
      <text x="20" y="142">Workflows</text><text x="150" y="142">Output review</text>
      <text x="20" y="164">Agent Studio</text><text x="150" y="164">Model Studio</text>
      <text x="20" y="186">Zenfluence</text><text x="150" y="186">Chat and connections</text>
      <text x="20" y="208">Work queue</text><text x="150" y="208">Settings</text>
    </g>
  </g>
  <line x1="352" y1="235" x2="418" y2="235" stroke="#8a8a9a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="385" y="222" fill="#8a8a9a" font-size="12" text-anchor="middle">http</text>

  <!-- server -->
  <g transform="translate(424 120)">
    <rect width="380" height="230" rx="14" fill="#1b1933" stroke="#3b3577"/>
    <text x="20" y="34" fill="#ededf2" font-size="17" font-weight="600">Loopback server</text>
    <text x="20" y="56" fill="#b0b0bf" font-size="13">127.0.0.1 only. Every rule the page shows is refused here too.</text>
    <g font-size="13">
      <rect x="20" y="76" width="160" height="44" rx="8" fill="#121218" stroke="#2e2e3a"/>
      <text x="32" y="94" fill="#ededf2" font-weight="600">HTTP API</text><text x="32" y="111" fill="#b0b0bf">membership per call</text>
      <rect x="200" y="76" width="160" height="44" rx="8" fill="#121218" stroke="#2e2e3a"/>
      <text x="212" y="94" fill="#ededf2" font-weight="600">Schemas (zod)</text><text x="212" y="111" fill="#b0b0bf">unknown fields refused</text>
      <rect x="20" y="132" width="160" height="44" rx="8" fill="#121218" stroke="#2e2e3a"/>
      <text x="32" y="150" fill="#ededf2" font-weight="600">Pipeline engine</text><text x="32" y="167" fill="#b0b0bf">stages, gates, signatures</text>
      <rect x="200" y="132" width="160" height="44" rx="8" fill="#121218" stroke="#2e2e3a"/>
      <text x="212" y="150" fill="#ededf2" font-weight="600">Bot runtime</text><text x="212" y="167" fill="#b0b0bf">allowlist, budget, timeout</text>
      <rect x="20" y="188" width="340" height="30" rx="8" fill="#121218" stroke="#2e2e3a"/>
      <text x="32" y="208" fill="#ededf2" font-weight="600">MCP server <tspan fill="#b0b0bf" font-weight="400">any MCP client, same rules, scoped</tspan></text>
    </g>
  </g>
  <line x1="808" y1="235" x2="874" y2="235" stroke="#8a8a9a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="841" y="222" fill="#8a8a9a" font-size="12" text-anchor="middle">atomic</text>

  <!-- disk -->
  <g transform="translate(880 120)">
    <rect width="272" height="230" rx="14" fill="#121218" stroke="#2e2e3a"/>
    <ellipse cx="60" cy="40" rx="34" ry="12" fill="#1a1a23" stroke="#42424f"/>
    <path d="M26 40 v40 a34 12 0 0 0 68 0 v-40" fill="#1a1a23" stroke="#42424f"/>
    <text x="110" y="46" fill="#ededf2" font-size="17" font-weight="600">Workspace on disk</text>
    <text x="110" y="70" fill="#b0b0bf" font-size="13">A folder of JSON documents</text>
    <text x="20" y="120" fill="#b0b0bf" font-size="13">Storage version checked on load</text>
    <text x="20" y="142" fill="#b0b0bf" font-size="13">Write to temp, then rename</text>
    <text x="20" y="164" fill="#b0b0bf" font-size="13">Approvals, runs, agents, tests, audit</text>
    <text x="20" y="186" fill="#b0b0bf" font-size="13">Setting names only, never secret values</text>
    <text x="20" y="208" fill="#6fd3a0" font-size="13">Where is my data: one folder</text>
  </g>

  <!-- outbound row -->
  <g font-size="13">
    <line x1="614" y1="354" x2="614" y2="392" stroke="#8a8a9a" stroke-width="2" marker-end="url(#a)"/>
    <text x="630" y="380" fill="#8a8a9a" font-size="12">outbound, all https, size and time capped</text>
    <g transform="translate(48 400)">
      <rect width="256" height="110" rx="12" fill="#121218" stroke="#2e2e3a"/>
      <text x="18" y="30" fill="#ededf2" font-weight="600">Models</text>
      <text x="18" y="54" fill="#b0b0bf">Local Ollama on the laptop,</text>
      <text x="18" y="72" fill="#b0b0bf">or provider keys by setting name.</text>
      <text x="18" y="94" fill="#b0b0bf">First run explains setup.</text>
    </g>
    <g transform="translate(330 400)">
      <rect width="256" height="110" rx="12" fill="#121218" stroke="#2e2e3a"/>
      <text x="18" y="30" fill="#ededf2" font-weight="600">Atlassian (Zenfluence)</text>
      <text x="18" y="54" fill="#b0b0bf">Read a Jira ticket or Confluence</text>
      <text x="18" y="72" fill="#b0b0bf">page, attach a hashed snapshot.</text>
      <text x="18" y="94" fill="#b0b0bf">Never writes to Atlassian.</text>
    </g>
    <g transform="translate(612 400)">
      <rect width="256" height="110" rx="12" fill="#121218" stroke="#2e2e3a"/>
      <text x="18" y="30" fill="#ededf2" font-weight="600">Company server</text>
      <text x="18" y="54" fill="#b0b0bf">Same code with sign in, tenants,</text>
      <text x="18" y="72" fill="#b0b0bf">per workspace storage and</text>
      <text x="18" y="94" fill="#b0b0bf">independent reviewers.</text>
    </g>
    <g transform="translate(894 400)">
      <rect width="258" height="110" rx="12" fill="#121218" stroke="#2e2e3a"/>
      <text x="18" y="30" fill="#ededf2" font-weight="600">Windows package</text>
      <text x="18" y="54" fill="#b0b0bf">Bundled runtime, Edge window,</text>
      <text x="18" y="72" fill="#b0b0bf">SHA256 manifest, per user install,</text>
      <text x="18" y="94" fill="#b0b0bf">uninstaller keeps data.</text>
    </g>
  </g>
  <text x="48" y="542" fill="#8a8a9a" font-size="12">TypeScript end to end. Tests run the real engine, the real HTTP server on a random port, and the real bot worker against a temporary Git checkout.</text>
</svg>
