name: Windows package

# Builds the Magentic Developer Windows package on a tag such as v0.2.0, or on
# demand for a dry run. The package is attached to the release for a tag and
# kept as a workflow artifact otherwise. Nothing here signs the package.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The packager pins the exact runtime it bundles; see workbench/desktop/build.mjs.
          node-version: 22.23.2
      - run: corepack enable
      - run: corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:workbench
      - run: pnpm build:desktop
      - name: Smoke test the package
        shell: pwsh
        run: |
          $package = Get-ChildItem dist\desktop -Directory | Sort-Object Name | Select-Object -Last 1
          & "$($package.FullName)\runtime\node.exe" "$($package.FullName)\launcher.mjs" --smoke-test
      - name: Record checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\desktop\*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content dist\desktop\SHA256SUMS.txt
          Get-Content dist\desktop\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: magentic-developer-windows
          path: |
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS.txt
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS.txt
