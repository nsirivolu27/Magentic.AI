<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <rect width="1200" height="300" rx="18" fill="#0b0b0f"/>
  <text x="48" y="50" fill="#ededf2" font-size="24" font-weight="600">The road to November 20</text>
  <text x="48" y="76" fill="#b0b0bf" font-size="15">Seven delivery epics, forty stories, one person. Filled marks are done; hollow marks are the last stretch.</text>
  <line x1="90" y1="160" x2="1112" y2="160" stroke="#2e2e3a" stroke-width="4"/>
  <line x1="90" y1="160" x2="820" y2="160" stroke="#6457e0" stroke-width="4"/>
  <g font-size="12.5" text-anchor="middle">
    <g transform="translate(90 160)"><circle r="11" fill="#6457e0" stroke="#0b0b0f" stroke-width="3"/><text y="-26" fill="#ededf2" font-weight="600">Kickoff</text><text y="40" fill="#b0b0bf">Problem framed,</text><text y="58" fill="#b0b0bf">engine and gates</text></g>
    <g transform="translate(236 160)"><circle r="11" fill="#6457e0" stroke="#0b0b0f" stroke-width="3"/><text y="-26" fill="#ededf2" font-weight="600">Output review</text><text y="40" fill="#b0b0bf">Evidence trail,</text><text y="58" fill="#b0b0bf">handoff, approval grid</text></g>
    <g transform="translate(382 160)"><circle r="11" fill="#6457e0" stroke="#0b0b0f" stroke-width="3"/><text y="-26" fill="#ededf2" font-weight="600">Agent Studio</text><text y="40" fill="#b0b0bf">Tests bound to the</text><text y="58" fill="#b0b0bf">agent version</text></g>
    <g transform="translate(528 160)"><circle r="11" fill="#6457e0" stroke="#0b0b0f" stroke-width="3"/><text y="-26" fill="#ededf2" font-weight="600">Design system</text><text y="40" fill="#b0b0bf">Tokens, dark theme,</text><text y="58" fill="#b0b0bf">360 px, 5.0:1 contrast</text></g>
    <g transform="translate(674 160)"><circle r="11" fill="#6457e0" stroke="#0b0b0f" stroke-width="3"/><text y="-26" fill="#ededf2" font-weight="600">Windows app</text><text y="40" fill="#b0b0bf">Installer, uninstaller,</text><text y="58" fill="#b0b0bf">update feed</text></g>
    <g transform="translate(820 160)"><circle r="11" fill="#6457e0" stroke="#0b0b0f" stroke-width="3"/><text y="-26" fill="#ededf2" font-weight="600">Zenfluence</text><text y="40" fill="#b0b0bf">Jira and Confluence</text><text y="58" fill="#b0b0bf">as evidence</text></g>
    <g transform="translate(966 160)"><circle r="11" fill="#0b0b0f" stroke="#8a8a9a" stroke-width="3"/><text y="-26" fill="#ededf2" font-weight="600">Signed package</text><text y="40" fill="#b0b0bf">Windows checks,</text><text y="58" fill="#b0b0bf">signing, live Jira</text></g>
    <g transform="translate(1112 160)"><circle r="11" fill="#0b0b0f" stroke="#e9c46a" stroke-width="3"/><text y="-26" fill="#e9c46a" font-weight="600">Nov 20 pitch</text><text y="40" fill="#b0b0bf">Install, draft, review,</text><text y="58" fill="#b0b0bf">approve, attach</text></g>
  </g>
</svg>
